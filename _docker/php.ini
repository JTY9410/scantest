[PHP]
memory_limit=2G
max_execution_time=300
max_input_time=300
post_max_size=100M
upload_max_filesize=100M
error_reporting=E_ALL
; Security hardening for production
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/var/log/php_errors.log

; Disable dangerous functions (RCE prevention)
disable_functions=exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,pcntl_exec,proc_get_status,proc_nice,proc_terminate

; Restrict file access
open_basedir=/var/www:/tmp:/usr/share/php

[opcache]
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0

[xdebug]
xdebug.mode=off
