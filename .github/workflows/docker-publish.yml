name: Build and Push Docker Image

on:
  # Only trigger after Test Suite completes successfully (no direct tag push trigger)
  workflow_run:
    workflows: ["Test Suite"]
    types:
      - completed
  workflow_dispatch:

env:
  IMAGE_NAME: wecarmobility/scantest
  GHCR_IMAGE: ghcr.io/jty9410/scantest

jobs:
  build-and-push:
    # Only run if Test Suite workflow succeeded
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Docker Hub 토큰이 없으면 GHCR에만 올린다.
      # 사용자 이름이 비어 있으면 이미지 이름과 같은 wecarmobility를 쓴다.
      # 토큰은 DOCKERHUB_TOKEN 또는 저장소에 넣은 WECARMOBILITY를 읽는다.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || 'wecarmobility' }}
      DOCKERHUB_READY: ${{ (secrets.DOCKERHUB_TOKEN != '' || secrets.WECARMOBILITY != '') && 'yes' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0  # Need full history for tags

      - name: Determine tags for this SHA
        id: tags
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "SHA=${SHA}" >> $GITHUB_OUTPUT
          
          # Find all tags pointing to this SHA
          TAGS=$(git tag --points-at ${SHA} | grep '^v' || true)
          echo "Git tags at ${SHA}: ${TAGS}"
          
          if [ -n "$TAGS" ]; then
            echo "is_tag_build=true" >> $GITHUB_OUTPUT
            # Take first version tag
            VERSION_TAG=$(echo "$TAGS" | head -1)
            echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
            echo "Building version ${VERSION_TAG} for SHA ${SHA}"
          else
            echo "is_tag_build=false" >> $GITHUB_OUTPUT
            echo "Building commit SHA ${SHA} (no version tag)"
          fi
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_READY == 'yes'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_TOKEN || secrets.WECARMOBILITY }}

      - name: Build metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_READY == 'yes' && env.IMAGE_NAME || '' }}
          tags: |
            type=raw,value=${{ steps.tags.outputs.version_tag }},enable=${{ steps.tags.outputs.is_tag_build == 'true' }}
            type=raw,value=latest,enable=${{ steps.tags.outputs.is_tag_build == 'true' }}
            type=sha,prefix=
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version_tag || steps.tags.outputs.SHA }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
