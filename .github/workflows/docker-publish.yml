name: Build and Push Docker Image

on:
  # Only trigger after both Test Suite and Smoke Test complete successfully
  workflow_run:
    workflows: ["Test Suite", "Smoke Test"]
    types:
      - completed
  workflow_dispatch:

env:
  IMAGE_NAME: wecarmobility/scantest
  GHCR_IMAGE: ghcr.io/jty9410/scantest

jobs:
  # Check that BOTH Test Suite and Smoke Test passed for this SHA
  check-prerequisites:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Check both workflows passed
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          
          # Check if the triggering workflow succeeded
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "Triggering workflow (${{ github.event.workflow_run.name }}) did not succeed"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Get status of both required workflows for this SHA
          TEST_SUITE=$(gh api /repos/${{ github.repository }}/actions/runs \
            -f head_sha="${SHA}" \
            -f event=push \
            -f status=completed \
            --jq '.workflow_runs[] | select(.name == "Test Suite") | .conclusion' | head -1)
          
          SMOKE_TEST=$(gh api /repos/${{ github.repository }}/actions/runs \
            -f head_sha="${SHA}" \
            -f event=push \
            -f status=completed \
            --jq '.workflow_runs[] | select(.name == "Smoke Test") | .conclusion' | head -1)
          
          echo "SHA: ${SHA}"
          echo "Test Suite: ${TEST_SUITE}"
          echo "Smoke Test: ${SMOKE_TEST}"
          
          if [[ "${TEST_SUITE}" == "success" && "${SMOKE_TEST}" == "success" ]]; then
            echo "✓ Both workflows passed"
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Not all workflows passed yet"
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}
  
  build-and-push:
    needs: check-prerequisites
    # Only run if both Test Suite and Smoke Test succeeded
    if: needs.check-prerequisites.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Docker Hub 토큰이 없으면 GHCR에만 올린다.
      # 사용자 이름이 비어 있으면 이미지 이름과 같은 wecarmobility를 쓴다.
      # 토큰은 DOCKERHUB_TOKEN 또는 저장소에 넣은 WECARMOBILITY를 읽는다.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || 'wecarmobility' }}
      DOCKERHUB_READY: ${{ (secrets.DOCKERHUB_TOKEN != '' || secrets.WECARMOBILITY != '') && 'yes' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-prerequisites.outputs.sha }}
          fetch-depth: 0  # Need full history for tags

      - name: Determine tags for this SHA
        id: tags
        run: |
          SHA="${{ needs.check-prerequisites.outputs.sha }}"
          echo "SHA=${SHA}" >> $GITHUB_OUTPUT
          
          # Find all tags pointing to this SHA
          TAGS=$(git tag --points-at ${SHA} | grep '^v' || true)
          echo "Git tags at ${SHA}: ${TAGS}"
          
          if [ -n "$TAGS" ]; then
            echo "is_tag_build=true" >> $GITHUB_OUTPUT
            # Take first version tag
            VERSION_TAG=$(echo "$TAGS" | head -1)
            echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
            echo "Building version ${VERSION_TAG} for SHA ${SHA}"
          else
            echo "is_tag_build=false" >> $GITHUB_OUTPUT
            echo "Building commit SHA ${SHA} (no version tag)"
          fi
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_READY == 'yes'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_TOKEN || secrets.WECARMOBILITY }}

      - name: Build metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_READY == 'yes' && env.IMAGE_NAME || '' }}
          tags: |
            type=raw,value=${{ steps.tags.outputs.version_tag }},enable=${{ steps.tags.outputs.is_tag_build == 'true' }}
            type=raw,value=latest,enable=${{ steps.tags.outputs.is_tag_build == 'true' }}
            type=sha,prefix=
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version_tag || steps.tags.outputs.SHA }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
