name: Build and Push Docker Image

on:
  # Run after Test Suite passes on main/master, or workflow_dispatch
  # Tag pushes must wait for Test Suite to pass (handled in jobs)
  workflow_run:
    workflows: ["Test Suite"]
    types:
      - completed
    branches:
      - main
      - master
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: wecarmobility/scantest
  GHCR_IMAGE: ghcr.io/jty9410/scantest

jobs:
  # For tag pushes, wait for Test Suite to complete and check it passed
  check-tests:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      tests-passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Check Test Suite status for this SHA
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            console.log(`Checking Test Suite for SHA: ${sha}`);
            
            // Get workflow runs for Test Suite on this exact SHA
            const {data: runs} = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'test.yml',
              head_sha: sha,
              per_page: 1
            });
            
            if (runs.total_count === 0) {
              core.setFailed(`No Test Suite run found for SHA ${sha}. Tag pushes require passing tests.`);
              return;
            }
            
            const testRun = runs.workflow_runs[0];
            console.log(`Test Suite status: ${testRun.status}, conclusion: ${testRun.conclusion}`);
            
            if (testRun.status !== 'completed') {
              core.setFailed(`Test Suite is still ${testRun.status} for SHA ${sha}. Wait for completion.`);
              return;
            }
            
            if (testRun.conclusion !== 'success') {
              core.setFailed(`Test Suite failed (${testRun.conclusion}) for SHA ${sha}. Cannot publish image.`);
              return;
            }
            
            core.setOutput('passed', 'true');
            console.log(`✅ Test Suite passed for SHA ${sha}`);
  
  build-and-push:
    # Skip if workflow_run triggered but Test Suite failed
    # For tag pushes, require check-tests job to pass
    needs: [check-tests]
    if: |
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'push' && needs.check-tests.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Docker Hub 토큰이 없으면 GHCR에만 올린다.
      # 사용자 이름이 비어 있으면 이미지 이름과 같은 wecarmobility를 쓴다.
      # 토큰은 DOCKERHUB_TOKEN 또는 저장소에 넣은 WECARMOBILITY를 읽는다.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || 'wecarmobility' }}
      DOCKERHUB_READY: ${{ (secrets.DOCKERHUB_TOKEN != '' || secrets.WECARMOBILITY != '') && 'yes' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_READY == 'yes'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_TOKEN || secrets.WECARMOBILITY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_READY == 'yes' && env.IMAGE_NAME || '' }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
