name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    name: Docker Image Smoke Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scantest
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: scantest_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          push: false
          load: true
          tags: scantest:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Start container with real entrypoint
        run: |
          docker run -d \
            --name scantest-smoke \
            --network host \
            -e DATABASE_URL="postgresql://scantest:testpass@localhost:5432/scantest_smoke" \
            -e SECRET_KEY="smoke-test-secret-key-for-ci-only" \
            -e JWT_SECRET="smoke-test-jwt-secret-with-enough-length-for-hs256" \
            -e ENCRYPTION_KEY="4PjmU8z4M3K5L6N7P8Q9R0S1T2U3V4W5X6Y7Z8A9B0C=" \
            -e FLASK_ENV=production \
            -e AUTO_DB_UPGRADE=false \
            -e GUNICORN_WORKERS=1 \
            -e GUNICORN_TIMEOUT=60 \
            scantest:smoke \
            bash -c "flask db upgrade && flask battery-ref-seed && gunicorn -c gunicorn.conf.py app.wsgi:app"
      
      - name: Wait for /up endpoint
        run: |
          echo "Waiting for container to be ready..."
          for i in {1..60}; do
            if curl -f http://localhost:8000/up 2>/dev/null; then
              echo "Container is ready!"
              exit 0
            fi
            echo "Attempt $i: Not ready yet, waiting..."
            sleep 2
          done
          echo "ERROR: Container did not become ready in 120 seconds"
          docker logs scantest-smoke
          exit 1
      
      - name: Comprehensive smoke test (all v2.2.17 defects)
        run: |
          docker exec scantest-smoke flask shell << 'EOF'
          from app.extensions import db
          from sqlalchemy import text
          import sys
          
          print("=== DEFECT 1 & 2: Battery references ===")
          # Check row count (221 not 222 - no manual Tesla row)
          count = db.session.execute(text("SELECT COUNT(*) FROM battery_reference_capacity")).scalar()
          print(f"Battery reference count: {count}")
          assert count == 221, f"Expected 221 rows, got {count}"
          
          # Check PK044 and PK045
          pk044 = db.session.execute(text("SELECT COUNT(*) FROM battery_reference_capacity WHERE pack_id = 'PK044'")).scalar()
          pk045 = db.session.execute(text("SELECT COUNT(*) FROM battery_reference_capacity WHERE pack_id = 'PK045'")).scalar()
          print(f"PK044: {pk044}, PK045: {pk045}")
          assert pk044 > 0 and pk045 > 0, "PK044 or PK045 not found"
          
          # Check no manual rows
          manual_count = db.session.execute(text("SELECT COUNT(*) FROM battery_reference_capacity WHERE source_file = 'manual'")).scalar()
          print(f"Manual rows: {manual_count}")
          assert manual_count == 0, f"Found {manual_count} manual rows, expected 0"
          
          # Check no NULL capacity rows
          null_count = db.session.execute(text("""
              SELECT COUNT(*) FROM battery_reference_capacity 
              WHERE gross_capacity_kwh IS NULL 
                AND net_capacity_kwh IS NULL 
                AND official_capacity_kwh IS NULL
          """)).scalar()
          print(f"NULL capacity rows: {null_count}")
          assert null_count == 0, f"Found {null_count} NULL capacity rows"
          
          print("\n=== DEFECT 3: ML consistency scores schema ===")
          # Check schema has correct columns
          columns = db.session.execute(text("""
              SELECT column_name FROM information_schema.columns 
              WHERE table_name = 'ml_consistency_scores'
          """)).scalars().all()
          print(f"ml_consistency_scores columns: {columns}")
          assert 'issues' in columns, "Column 'issues' missing"
          assert 'issues_detected' not in columns, "'issues_detected' should be renamed"
          assert 'sufficient_data' in columns, "'sufficient_data' missing"
          assert 'min_samples_required' in columns, "'min_samples_required' missing"
          assert 'actual_samples' in columns, "'actual_samples' missing"
          
          print("\n✓ All database smoke tests passed")
          EOF
      
      - name: Test admin battery-references page (Defect 1)
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/admin/battery-references || echo "000")
          echo "Admin battery-references status: $response"
          if [ "$response" != "200" ] && [ "$response" != "302" ]; then
            echo "ERROR: Expected 200 or 302, got $response"
            docker logs scantest-smoke
            exit 1
          fi
          echo "✓ Battery-references page accessible"
      
      - name: Show container logs on failure
        if: failure()
        run: docker logs scantest-smoke
      
      - name: Cleanup
        if: always()
        run: |
          docker stop scantest-smoke || true
          docker rm scantest-smoke || true
