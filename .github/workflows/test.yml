name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wecarscan
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: wecarscan_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests
      env:
        TEST_DATABASE_URL: postgresql+psycopg://wecarscan:test_password@localhost:5432/wecarscan_test
        SECRET_KEY: test-secret-key-for-ci
        JWT_SECRET: test-jwt-secret-with-enough-length-for-hs256
        ENCRYPTION_KEY: 4PjmU8z4M3K5L6N7P8Q9R0S1T2U3V4W5X6Y7Z8A9B0C=
      run: |
        pytest tests/ -v --tb=short --timeout=30
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          pytest-*.log
          .pytest_cache/
