[project]
name = "wecarscan"
version = "2.0.0"
description = "WecarScan 진단 앱 API 서버와 관리자 웹"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask>=3.1.3,<3.2",
    "Flask-SQLAlchemy>=3.1.1,<3.2",
    "SQLAlchemy>=2.0.54,<2.1",
    "Flask-Migrate>=4.1,<5",
    "Flask-Login>=0.6.3,<0.7",
    "Flask-WTF>=1.2.2,<1.3",
    "Flask-Limiter>=3.12,<4",
    "PyJWT>=2.15,<3",
    "bcrypt>=5.0,<6",
    "cryptography>=50,<51",
    "pyotp>=2.10,<3",
    "segno>=1.6.6,<2",
    "httpx>=0.28.1,<0.29",
    "psycopg[binary]>=3.2.13,<3.3",
    "gunicorn>=23,<24",
    "python-dotenv>=1.2,<2",
    "email-validator>=2.3,<3",
    "redis>=6.4,<7",
    "pypdf>=6.20,<7",
    "pillow>=12.3,<13",
    "reportlab>=5.0.1,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.2,<9"]

[tool.vercel]
entrypoint = "app.wsgi:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
