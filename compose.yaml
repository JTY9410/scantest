# 로컬 개발·Mac 서버 공통. 서버는 이 파일 + docker-compose.override.yml(서버 전용, 커밋 안 함) + .env 로 실행.
# 시크릿은 서버 .env 에만 둔다. Vercel·Supabase 는 쓰지 않는다.
#
#   cp .env.example .env
#   docker compose up -d --build
#
# env_file 이 없어도 compose 가 실패하지 않는다(required: false).
name: scantest

services:
  web:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      PROXY_FIX_HOPS: ${PROXY_FIX_HOPS:-1}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-18080}:8000"
    volumes:
      - .:/srv
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  assets:
    image: node:24-slim
    working_dir: /srv
    command: sh -c "npm ci --no-audit --no-fund && npm run watch:css"
    volumes:
      - .:/srv
      - node_modules:/srv/node_modules

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wecarscan}
      POSTGRES_USER: ${POSTGRES_USER:-wecarscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
    volumes:
      # 볼륨 이름·Postgres 메이저(16)를 바꾸면 기존 데이터를 못 읽는다. 변경 시 README의 덤프→복원 절차를 따른다.
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./data/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  # 프로젝트 이름 변경(wecarscan_dh -> scantest) 후에도 기존 데이터 볼륨을 그대로 쓴다.
  pgdata:
    name: wecarscan_dh_pgdata
  node_modules:
    name: scantest_node_modules
