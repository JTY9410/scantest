# 로컬 개발용. 실행: docker compose up -d  →  http://localhost:18080/admin/
name: wecarscan_dh

services:
  web:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      APP_ENV: development
    ports:
      - "18080:8000"
    volumes:
      - .:/srv
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  assets:
    image: node:24-slim
    working_dir: /srv
    command: sh -c "npm ci --no-audit --no-fund && npm run watch:css"
    volumes:
      - .:/srv
      - node_modules:/srv/node_modules

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wecarscan}
      POSTGRES_USER: ${POSTGRES_USER:-wecarscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  node_modules:
