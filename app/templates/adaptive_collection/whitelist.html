{% extends "base.html" %}

{% block title %}Signal Whitelist{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-4">신호 화이트리스트</h1>
  
  <table class="w-full border">
    <thead>
      <tr class="bg-gray-100">
        <th class="px-4 py-2">Signal</th>
        <th class="px-4 py-2">Reason</th>
        <th class="px-4 py-2">Description</th>
      </tr>
    </thead>
    <tbody>
      {% for item in whitelist %}
      <tr>
        <td class="border px-4 py-2">{{ item.signal_identifier }}</td>
        <td class="border px-4 py-2">{{ item.reason }}</td>
        <td class="border px-4 py-2">{{ item.description or '' }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
