{% extends "layouts/admin.html" %}
{% block title %}파일 업로드{% endblock %}
{% block content %}
<div class="container mx-auto py-6 px-4">
  <h1 class="text-2xl font-bold mb-6">스캔 데이터 업로드</h1>
  
  <form method="POST" action="/scanner/upload" enctype="multipart/form-data" class="max-w-2xl">
    {{ csrf_token() }}
    
    <div class="mb-4">
      <label class="block text-sm font-bold mb-2">파일 선택</label>
      <input type="file" name="files[]" multiple accept=".csv,.trc,.txt,.log" required class="w-full border rounded px-3 py-2">
      <p class="text-sm text-gray-600 mt-1">CSV, TRC, TXT, LOG 파일 지원</p>
    </div>
    
    <div class="mb-4">
      <label class="block text-sm font-bold mb-2">차량번호 (선택사항)</label>
      <input type="text" name="car_no" placeholder="예: 88가8888" class="w-full border rounded px-3 py-2">
    </div>
    
    <div class="mb-4">
      <label class="flex items-center">
        <input type="checkbox" name="force_full_scan" value="true" class="mr-2">
        <span class="font-bold">전체 스캔 강제</span>
      </label>
      <p class="text-sm text-gray-600 mt-1 ml-6">체크 시 수집 프로파일을 무시하고 모든 항목을 수집합니다</p>
    </div>
    
    <div class="flex gap-2">
      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">업로드</button>
      <a href="/monitoring/scans" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">취소</a>
    </div>
  </form>
</div>
{% endblock %}
