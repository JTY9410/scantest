{# 블루투스 진단기 연결 패널. 스크립트는 obd-link.js의 WecarObd.bindPanel이 연결한다. #}
{% macro obd_panel(obd) %}
<script type="application/json" id="obd-config">{{ obd|tojson }}</script>
<div data-obd-panel>
  <p class="flash flash-warning" data-obd-unsupported hidden><span aria-hidden="true" class="font-bold">!</span>
    <span>이 브라우저는 블루투스 연결을 지원하지 않습니다. 안드로이드·PC의 Chrome 또는 Edge를 쓰거나, 아이폰은 위카 앱으로 수집하세요.</span></p>
  <div class="grid gap-4 md:grid-cols-[minmax(0,1fr)_auto] md:items-end">
    <div class="field">
      <label class="field-label" for="obd-profile">진단기 종류</label>
      <select class="input" id="obd-profile" data-obd-profile>
        <option value="">자동 감지(권장)</option>
        {% for p in obd.profiles %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="flex flex-wrap gap-2">
      <button class="btn btn-primary" type="button" data-obd-find>진단기 연결</button>
      <button class="btn btn-secondary" type="button" data-obd-find-all>모든 기기 보기</button>
      <button class="btn btn-secondary" type="button" data-obd-disconnect disabled>연결 끊기</button>
    </div>
  </div>
  <p class="mt-3 font-semibold" role="status" aria-live="polite" data-obd-status>시동을 켜고 진단기를 OBD2 단자에 꽂은 뒤 '진단기 연결'을 누르세요.</p>
  <dl class="dl mt-3" data-obd-info hidden>
    <dt>진단기</dt><dd data-obd-name>-</dd>
    <dt>펌웨어</dt><dd data-obd-version>-</dd>
    <dt>차량 전압</dt><dd class="tabular-nums" data-obd-voltage>-</dd>
  </dl>
</div>
{% endmacro %}
