{% macro manual_powertrain_form(scan_id, current_powertrain, current_source) %}
<section class="card mt-6" aria-labelledby="manual-powertrain-title">
  <div class="card-body">
    <h2 id="manual-powertrain-title" class="text-lg font-bold">동력원 수동 분류</h2>
    <p class="text-sm text-muted mt-2">자동 분류가 틀린 경우 수동으로 수정할 수 있습니다.</p>
    
    <form id="powertrain-override-form" class="mt-4">
      <div class="mb-4">
        <label for="powertrain-select" class="block text-sm font-medium mb-2">동력원 선택</label>
        <select id="powertrain-select" name="powertrain" class="form-select w-full" required>
          <option value="">선택하세요</option>
          <option value="BEV" {% if current_powertrain == 'BEV' %}selected{% endif %}>BEV (순수 전기)</option>
          <option value="PHEV" {% if current_powertrain == 'PHEV' %}selected{% endif %}>PHEV (플러그인 하이브리드)</option>
          <option value="HEV" {% if current_powertrain == 'HEV' %}selected{% endif %}>HEV (하이브리드)</option>
          <option value="FCEV" {% if current_powertrain == 'FCEV' %}selected{% endif %}>FCEV (수소연료전지)</option>
          <option value="ICE" {% if current_powertrain == 'ICE' %}selected{% endif %}>ICE (내연기관)</option>
          <option value="not_vehicle" {% if current_powertrain == 'not_vehicle' %}selected{% endif %}>차량 아님</option>
          <option value="unknown" {% if current_powertrain == 'unknown' %}selected{% endif %}>알 수 없음</option>
        </select>
      </div>
      
      <div class="mb-4">
        <label for="reason-input" class="block text-sm font-medium mb-2">수정 사유 (선택)</label>
        <textarea id="reason-input" name="reason" class="form-textarea w-full" rows="3" 
                  placeholder="예: 실제 차량 확인 결과 PHEV 모델임"></textarea>
      </div>
      
      <div class="flex gap-2">
        <button type="submit" class="btn btn-primary" id="override-submit-btn">
          <span class="inline-block" id="override-spinner" style="display:none;">⏳</span>
          저장
        </button>
        
        {% if current_source and current_source.startswith('manual_override') %}
        <button type="button" class="btn btn-secondary" id="revert-btn">
          자동 분류로 복원
        </button>
        {% endif %}
      </div>
    </form>
    
    <div id="powertrain-result" class="mt-4" style="display:none;">
      <div class="flash flash-success">
        <span aria-hidden="true" class="font-bold">✓</span>
        <p id="powertrain-result-message"></p>
      </div>
    </div>
    
    <div id="powertrain-error" class="mt-4" style="display:none;">
      <div class="flash flash-error">
        <span aria-hidden="true" class="font-bold">✗</span>
        <p id="powertrain-error-message"></p>
      </div>
    </div>
  </div>
</section>

<script>
(function() {
  const form = document.getElementById('powertrain-override-form');
  const submitBtn = document.getElementById('override-submit-btn');
  const spinner = document.getElementById('override-spinner');
  const resultDiv = document.getElementById('powertrain-result');
  const resultMsg = document.getElementById('powertrain-result-message');
  const errorDiv = document.getElementById('powertrain-error');
  const errorMsg = document.getElementById('powertrain-error-message');
  const revertBtn = document.getElementById('revert-btn');
  
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(form);
    const powertrain = formData.get('powertrain');
    const reason = formData.get('reason');
    
    if (!powertrain) {
      errorMsg.textContent = '동력원을 선택해주세요.';
      errorDiv.style.display = 'block';
      resultDiv.style.display = 'none';
      return;
    }
    
    submitBtn.disabled = true;
    spinner.style.display = 'inline-block';
    errorDiv.style.display = 'none';
    resultDiv.style.display = 'none';
    
    try {
      const response = await fetch('{{ url_for("monitoring.override_scan_powertrain", scan_id=scan_id) }}', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ powertrain, reason })
      });
      
      const data = await response.json();
      
      if (response.ok && data.success) {
        resultMsg.textContent = `동력원이 ${data.new_powertrain}(으)로 변경되었습니다.`;
        resultDiv.style.display = 'block';
        
        // Reload after 1 second to show updated data
        setTimeout(() => window.location.reload(), 1000);
      } else {
        errorMsg.textContent = data.error || '저장에 실패했습니다.';
        errorDiv.style.display = 'block';
      }
    } catch (error) {
      errorMsg.textContent = '네트워크 오류가 발생했습니다.';
      errorDiv.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      spinner.style.display = 'none';
    }
  });
  
  if (revertBtn) {
    revertBtn.addEventListener('click', async () => {
      if (!confirm('자동 분류로 복원하시겠습니까?')) return;
      
      revertBtn.disabled = true;
      errorDiv.style.display = 'none';
      resultDiv.style.display = 'none';
      
      try {
        const response = await fetch('{{ url_for("monitoring.revert_scan_powertrain", scan_id=scan_id) }}', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          }
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          resultMsg.textContent = `자동 분류로 복원되었습니다: ${data.new_powertrain} (출처: ${data.new_source})`;
          resultDiv.style.display = 'block';
          
          // Reload after 1 second
          setTimeout(() => window.location.reload(), 1000);
        } else {
          errorMsg.textContent = data.error || '복원에 실패했습니다.';
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorMsg.textContent = '네트워크 오류가 발생했습니다.';
        errorDiv.style.display = 'block';
      } finally {
        revertBtn.disabled = false;
      }
    });
  }
})();
</script>
{% endmacro %}
