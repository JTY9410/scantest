{% extends "layouts/base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block body %}
<div class="flex min-h-dvh flex-col">
  <header class="flex h-14 items-center bg-ink px-4 text-on-ink sm:px-6">
    <a href="{{ url_for('admin.dashboard') }}" class="flex min-h-11 items-center">
      <img src="{{ url_for('static', filename='brand/wecar-logo.png') }}" alt="WECAR" width="104" height="18" class="h-[18px] w-auto">
    </a>
  </header>
  <main id="main" class="flex flex-1 items-center justify-center px-4 py-12" tabindex="-1">
    <div class="card card-body w-full max-w-md text-center">
      <p class="text-sm font-semibold text-muted">오류 {{ code }}</p>
      <h1 class="mt-2 text-2xl font-bold">{{ title }}</h1>
      <p class="mt-3 text-muted">
        {{ message or "잠시 후 다시 시도하세요. 문제가 계속되면 시스템 담당자에게 알려 주세요." }}
      </p>
      <div class="mt-6 flex flex-wrap justify-center gap-2">
        <a class="btn btn-primary" href="{{ url_for('admin.dashboard') }}">대시보드로 이동</a>
      </div>
    </div>
  </main>
  {% include "components/footer.html" %}
</div>
{% endblock %}
