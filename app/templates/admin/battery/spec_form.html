{% extends "layouts/admin.html" %}
{% block title %}{% if spec %}사양 수정{% else %}사양 추가{% endif %}{% endblock %}

{% block content %}
<div class="mb-6">
  <h1 class="text-2xl font-bold">{% if spec %}사양 수정{% else %}사양 추가{% endif %}</h1>
  <p class="text-muted">배터리 사양 정보를 입력하세요</p>
</div>

<form method="post" class="max-w-3xl">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  
  <div class="card card-body space-y-6">
    <section>
      <h2 class="mb-4 text-lg font-semibold">기본 정보</h2>
      <div class="space-y-4">
        <div>
          <label class="label">제조사 *</label>
          <input type="text" name="maker" value="{{ spec.maker if spec else '' }}" required class="input">
        </div>
        <div>
          <label class="label">모델 *</label>
          <input type="text" name="model" value="{{ spec.model if spec else '' }}" required class="input">
        </div>
        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="label">트림/등급</label>
            <input type="text" name="trim_grade" value="{{ spec.trim_grade if spec else '' }}" class="input">
          </div>
          <div>
            <label class="label">연식</label>
            <input type="number" name="model_year" value="{{ spec.model_year if spec else '' }}" class="input">
          </div>
        </div>
        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="label">세대</label>
            <input type="text" name="generation" value="{{ spec.generation if spec else '' }}" class="input">
          </div>
          <div>
            <label class="label">시장</label>
            <input type="text" name="market" value="{{ spec.market if spec else '' }}" placeholder="KR, US, EU" class="input">
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2 class="mb-4 text-lg font-semibold">배터리 제원</h2>
      <div class="space-y-4">
        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="label">총 용량 (kWh)</label>
            <input type="number" step="0.1" name="gross_kwh" value="{{ spec.gross_kwh if spec else '' }}" class="input">
          </div>
          <div>
            <label class="label">사용 가능 용량 (kWh)</label>
            <input type="number" step="0.1" name="usable_kwh" value="{{ spec.usable_kwh if spec else '' }}" class="input">
          </div>
        </div>
        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="label">공칭 전압 (V)</label>
            <input type="number" step="0.1" name="nominal_voltage_v" value="{{ spec.nominal_voltage_v if spec else '' }}" class="input">
          </div>
          <div>
            <label class="label">용량 (Ah)</label>
            <input type="number" step="0.1" name="capacity_ah" value="{{ spec.capacity_ah if spec else '' }}" class="input">
          </div>
        </div>
        <div class="grid gap-4 md:grid-cols-3">
          <div>
            <label class="label">셀 화학</label>
            <input type="text" name="cell_chemistry" value="{{ spec.cell_chemistry if spec else '' }}" placeholder="NMC, LFP, NCA" class="input">
          </div>
          <div>
            <label class="label">셀 개수</label>
            <input type="number" name="cell_count" value="{{ spec.cell_count if spec else '' }}" class="input">
          </div>
          <div>
            <label class="label">셀 구성</label>
            <input type="text" name="cell_config" value="{{ spec.cell_config if spec else '' }}" placeholder="96s2p" class="input">
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2 class="mb-4 text-lg font-semibold">출처 정보</h2>
      <div class="space-y-4">
        <div>
          <label class="label">출처 URL *</label>
          <input type="url" name="source_url" value="{{ spec.source_url if spec else '' }}" required class="input">
          <p class="mt-1 text-sm text-muted">제조사 공식 페이지 우선, 없으면 ev-database.org 등</p>
        </div>
        <div>
          <label class="label">추가 메모</label>
          <textarea name="source_note" rows="3" class="input">{{ spec.source_note if spec else '' }}</textarea>
        </div>
      </div>
    </section>
  </div>

  <div class="mt-6 flex gap-2">
    <button type="submit" class="btn btn-primary">저장</button>
    <a href="{% if spec %}{{ url_for('battery_admin.spec_detail', spec_id=spec.id) }}{% else %}{{ url_for('battery_admin.specs_list') }}{% endif %}" class="btn">취소</a>
  </div>
</form>
{% endblock %}
