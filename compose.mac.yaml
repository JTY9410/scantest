# 로컬 Mac에서 prod 이미지(gunicorn)로 web 만 띄울 때.
#   docker compose -f compose.yaml -f compose.mac.yaml up -d --build web
# 서버(nginx HTTPS)는 compose.prod.yaml + override + .env 를 쓰고, 이 파일의
# SESSION_COOKIE_SECURE=false 는 로컬 HTTP 전용이다.
services:
  web:
    build:
      context: .
      target: prod
    environment:
      APP_ENV: production
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PREFERRED_URL_SCHEME: ${PREFERRED_URL_SCHEME:-http}
      AUTO_DB_UPGRADE: ${AUTO_DB_UPGRADE:-1}
      PROXY_FIX_HOPS: ${PROXY_FIX_HOPS:-1}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes: !reset []
