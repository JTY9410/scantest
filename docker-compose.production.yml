services:
  app:
    build:
      context: .
      dockerfile: _docker/Dockerfile
    container_name: wecarscan-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - TZ=${APP_TIMEZONE}
    networks:
      - wecarscan_wecarscan-network

  nginx:
    image: nginx:alpine
    container_name: wecarscan-nginx
    restart: unless-stopped
    ports:
      - "${FORWARD_WEB_PORT}:80"
    volumes:
      - .:/var/www
      - ./_storage/nginx/logs:/var/log/nginx
      - ./_docker/nginx:/etc/nginx/conf.d/
    environment:
      - TZ=${APP_TIMEZONE}
    networks:
      - wecarscan_wecarscan-network

networks:
  wecarscan_wecarscan-network:
    driver: bridge
