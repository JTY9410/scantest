# Mac 서버 운영용. 시크릿은 서버 .env 에만 두고 레포에 올리지 않는다.
#   docker compose -f compose.prod.yaml up -d
# 서버는 보통: compose.prod.yaml + docker-compose.override.yml(서버 전용) + .env
# AUTO_DB_UPGRADE=1 이면 web 기동 전 flask db upgrade 를 1회 실행한다.
name: wecarscan_prod

services:
  web:
    image: wecarmobility/scantest:${IMAGE_TAG:-latest}
    build:
      context: .
      target: prod
    env_file:
      - path: .env
        required: false
      - path: .env.production
        required: false
    environment:
      APP_ENV: production
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      AUTO_DB_UPGRADE: ${AUTO_DB_UPGRADE:-1}
      PROXY_FIX_HOPS: ${PROXY_FIX_HOPS:-1}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      PREFERRED_URL_SCHEME: ${PREFERRED_URL_SCHEME:-https}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wecarscan}
      POSTGRES_USER: ${POSTGRES_USER:-wecarscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 필요합니다}
    volumes:
      # 볼륨 이름·Postgres 메이저(16) 변경 금지(기존 데이터). 바꿀 때는 README 덤프→복원.
      - pgdata:/var/lib/postgresql/data
      # init: 빈 볼륨 최초 기동 때 시드 복원 + ${POSTGRES_DB}_test 생성
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./data/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
    name: wecarscan_dh_pgdata
