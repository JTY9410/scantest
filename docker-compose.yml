services:
  app:
    build:
      context: .
      dockerfile: _docker/Dockerfile
    container_name: wecarscan-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - TZ=Asia/Seoul
    networks:
      - wecarscan-network
    command: >
      sh -c "cron && php-fpm && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mariadb:10.11
    container_name: wecarscan-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
      TZ: Asia/Seoul
    volumes:
      - ./_storage/mysql:/var/lib/mysql
      - ./_docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "${FORWARD_DB_PORT}:3306"
    networks:
      - wecarscan-network
    command: --skip-host-cache --skip-name-resolve --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: wecarscan-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT}:6379"
    volumes:
      - ./_storage/redis:/data
    environment:
      - TZ=Asia/Seoul
    networks:
      - wecarscan-network

  nginx:
    image: nginx:alpine
    container_name: wecarscan-nginx
    restart: unless-stopped
    ports:
      - "${FORWARD_WEB_PORT}:80"
    volumes:
      - .:/var/www
      - ./_storage/nginx/logs:/var/log/nginx
      - ./_docker/nginx:/etc/nginx/conf.d/
    environment:
      - TZ=Asia/Seoul
    networks:
      - wecarscan-network

networks:
  wecarscan-network:
    driver: bridge
